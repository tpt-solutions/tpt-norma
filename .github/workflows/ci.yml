name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy-test:
    name: Format, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace depends on sibling checkouts by relative path (see Cargo.toml),
      # so they must sit next to this repo, as they do on a developer machine.
      - name: Check out sibling repos
        run: |
          git clone --depth 1 https://github.com/tpt-solutions/tpt-telos.git ../tpt-telos
          git clone --depth 1 https://github.com/tpt-solutions/tpt-math.git ../tpt-math
          git clone --depth 1 https://github.com/tpt-solutions/tpt-solver.git ../tpt-solver
          git clone --depth 1 https://github.com/tpt-solutions/tpt-uir.git ../tpt-uir
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: Dependency & license policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run cargo-deny on the host rather than via cargo-deny-action: the action runs
      # in a container that only mounts this repo, so the sibling checkouts below
      # would not be visible and the path dependencies would fail to resolve.
      - name: Check out sibling repos
        run: |
          git clone --depth 1 https://github.com/tpt-solutions/tpt-telos.git ../tpt-telos
          git clone --depth 1 https://github.com/tpt-solutions/tpt-math.git ../tpt-math
          git clone --depth 1 https://github.com/tpt-solutions/tpt-solver.git ../tpt-solver
          git clone --depth 1 https://github.com/tpt-solutions/tpt-uir.git ../tpt-uir
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependencies and licenses
        run: cargo deny check
